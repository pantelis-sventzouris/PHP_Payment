services:
  app:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - /app/vendor
    environment:
      DB_PATH: /app/database/database.sqlite
      MAILER_DSN: smtp://mailpit:1025
      MAIL_FROM: reports@example.test
    depends_on:
      - mailpit

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
